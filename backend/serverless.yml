service: ai-xandria-backend

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    NODE_ENV: ${self:provider.stage}
    AWS_REGION: ${self:provider.region}
    BEDROCK_REGION: us-east-1
    RDS_HOST: ${env:RDS_HOST}
    RDS_USERNAME: ${env:RDS_USERNAME}
    RDS_PASSWORD: ${env:RDS_PASSWORD}
    RDS_DATABASE: ${env:RDS_DATABASE}
    JWT_SECRET: ${env:JWT_SECRET}
    SOMNIA_RPC_URL: ${env:SOMNIA_RPC_URL}
    NFT_CONTRACT_ADDRESS: ${env:NFT_CONTRACT_ADDRESS}
    IPFS_API_KEY: ${env:IPFS_API_KEY}
  
  iamRoleStatements:
    - Effect: Allow
      Action:
        - bedrock:InvokeModel
        - bedrock:ListFoundationModels
      Resource: "*"
    - Effect: Allow
      Action:
        - s3:PutObject
        - s3:GetObject
        - s3:DeleteObject
      Resource: "arn:aws:s3:::ai-xandria-${self:provider.stage}/*"
    - Effect: Allow
      Action:
        - transcribe:StartStreamTranscription
        - transcribe:StartTranscriptionJob
      Resource: "*"

plugins:
  - serverless-offline

functions:
  api:
    handler: src/lambda.handler
    timeout: 30
    memorySize: 512
    events:
      - httpApi: "*"

custom:
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true
