version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*

environment:
  variables:
    VITE_API_URL: $VITE_API_URL
    VITE_AWS_REGION: $VITE_AWS_REGION
    VITE_SOMNIA_RPC: $VITE_SOMNIA_RPC
    VITE_CONTRACT_ADDRESS: $VITE_CONTRACT_ADDRESS

customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'

rewrites:
  - source: '</^[^.]+$|\\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|ttf|map|json)$)([^.]+$)/>'
    target: /index.html
    status: '200'
